[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keel"
version = "0.0.1"
description = "A strictly-local, open-source coding-agent framework that makes a small open model punch at frontier level on an Apple-Silicon laptop."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Dhirendra Kumar Choudhary" }]
keywords = ["agent", "llm", "local", "mlx", "apple-silicon", "coding-agent", "small-models"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = []

[project.optional-dependencies]
# Apple-Silicon inference backends. Left unpinned here so CI (which does not run
# inference) stays light; pin exact MLX builds when serving them.
mlx = ["mlx-lm"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
keel = "keel.cli:main"

[project.urls]
Homepage = "https://github.com/dhirendrachoudhary/keel"
Documentation = "https://github.com/dhirendrachoudhary/keel/blob/main/docs/ARCHITECTURE.md"

[tool.hatch.build.targets.wheel]
packages = ["src/keel"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["keel"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["mlx_lm.*", "mlx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
